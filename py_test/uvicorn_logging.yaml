version: 1
disable_existing_loggers: false

formatters:
  json:
    "()": app.utils.module_logger.JsonFormatter

handlers:
  json:
    class: logging.StreamHandler
    formatter: json
    stream: ext://sys.stdout

loggers:
  uvicorn.error:
    handlers:
      - json
    level: INFO
    propagate: false

  uvicorn.access:
    handlers:
      - json
    level: INFO
    propagate: false

root:
  handlers:
    - json
  level: INFO